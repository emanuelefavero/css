<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <style>
      body {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        width: 100%;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
      }

      /* min() will select the smallest possible value. When viewport is smaller than 400px the box will take the viewport width size, without adding scrollbars */
      .box-min {
        background-color: rgb(241, 244, 246);
        width: min(300px, 100%);
        height: min(300px, 100%);
      }

      /* max() will select the largest possible value from within the parentheses and stay there */
      p {
        /* background-color: violet;
        width: max(400px, 100%);
        height: max(900px, 100%); */
        font-size: max(1rem, 5vw);
      }

      /* minmax() defines the minimum and maximum size of a grid track */
      .grid-minmax {
        width: min(700px, 100%);
        display: grid;
        grid-template-columns: repeat(2, minmax(100px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .grid-minmax div {
        background-color: rgb(214, 237, 255);
        border: 1px solid rgb(120, 170, 210);
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <div class="box-min"></div>
    <p>Hello max</p>
    <div class="grid-minmax">
      <div>minmax 1</div>
      <div>minmax 2</div>
    </div>
  </body>
</html>
