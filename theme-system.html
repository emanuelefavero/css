<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Follow System Theme</title>
  </head>
  <style>
    :root {
      --background: white;
      --foreground: black;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --background: black;
        --foreground: white;
      }
    }

    body {
      background-color: var(--background);
      color: var(--foreground);
    }
  </style>
  <body>
    <h1>Hello</h1>
  </body>
</html>
